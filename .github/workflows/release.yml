name: Release

# Builds self-contained single-file executables for every supported platform.
# Pushing a tag such as v1.2.0 publishes them as a GitHub Release.
# Running it manually (Actions tab > Release > Run workflow) only builds the artifacts.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,        os: ubuntu-latest, archive: zip }
          - { rid: win-arm64,      os: ubuntu-latest, archive: zip }
          - { rid: linux-x64,      os: ubuntu-latest, archive: tar }
          - { rid: linux-arm64,    os: ubuntu-latest, archive: tar }
          - { rid: linux-musl-x64, os: ubuntu-latest, archive: tar }
          # macOS builds run on macOS so the SDK can ad-hoc sign the executable (required on Apple silicon).
          - { rid: osx-arm64,      os: macos-latest,  archive: tar }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: >
          dotnet publish AutoPM_MCP/AutoPM_MCP.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o out
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="AutoPM_MCP-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p "pkg/$name" dist
          # Ship only what is needed to run: the executable and its settings file.
          cp out/AutoPM_MCP* out/appsettings.json "pkg/$name/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd pkg && zip -qr "../dist/$name.zip" "$name")
          else
            chmod +x "pkg/$name/AutoPM_MCP"
            tar -czf "dist/$name.tar.gz" -C pkg "$name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Self-contained AutoPM MCP Server executables. No .NET installation is required.

            | Platform | Download |
            |----------|----------|
            | Windows (Intel/AMD 64-bit) | `AutoPM_MCP-*-win-x64.zip` |
            | Windows on ARM | `AutoPM_MCP-*-win-arm64.zip` |
            | Linux (64-bit) | `AutoPM_MCP-*-linux-x64.tar.gz` |
            | Linux ARM 64-bit | `AutoPM_MCP-*-linux-arm64.tar.gz` |
            | Alpine Linux / musl | `AutoPM_MCP-*-linux-musl-x64.tar.gz` |
            | macOS (Apple silicon) | `AutoPM_MCP-*-osx-arm64.tar.gz` |

            **Before first run**, set your Agile PM API address in `appsettings.json` (`AgilePM:ApiBaseUrl`)
            or in the `AgilePM__ApiBaseUrl` environment variable. See the README's *Download and get started* section.
